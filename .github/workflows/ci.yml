# Comprobación rápida en cada cambio de main y en cada pull request: el código compila en Windows con Python 3.12.
name: CI
on:
  push:
    branches: [main]
  pull_request: {}
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compila todo el código
        shell: pwsh
        run: python -m compileall -q core gui main.py
